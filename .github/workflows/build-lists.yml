# Save as .github/workflows/build-lists.yml
name: Build face-off lists
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 6 UTC
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build-lists.js
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - name: Commit lists.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add lists.json
          git diff --cached --quiet || git commit -m "Update face-off lists"
          git push
